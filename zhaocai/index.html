<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>幸運體質｜每天穿對顏色，養出好運</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ---- 基本設定 ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold: #b88a3e;
    --gold-soft: #e6d4ab;
    --ink: #3a322a;
    --ink-soft: #7a6f60;
    --paper: #f6efe2;
    --card: #ffffff;
    --line: #ece1cd;
  }
  body {
    font-family: "Noto Sans TC", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 2%, #fff8ea 0%, transparent 40%),
      var(--paper);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Noto Serif TC", serif; }
  .wrap { max-width: 480px; margin: 0 auto; }   /* 以手機寬度為主軸置中 */

  /* ---- 封面進入畫面（點一下才進到每日卡片）---- */
  .cover-screen {
    position: fixed; inset: 0; z-index: 100;
    background: #0c0a08; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .6s ease;
  }
  .cover-screen img {
    width: 100%; height: 100%; object-fit: cover;
    object-position: center;
  }
  .cover-screen.fade { opacity: 0; pointer-events: none; }
  .enter-hint {
    position: absolute; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom));
    text-align: center; animation: breathe 1.8s ease-in-out infinite;
  }
  .enter-hint .pill {
    display: inline-block; padding: 16px 40px;
    color: #fff; font-size: 20px; letter-spacing: 3px; font-weight: 700;
    border: 2px solid rgba(255,255,255,.9); border-radius: 999px;
    background: linear-gradient(135deg, rgba(184,138,62,.96), rgba(150,110,30,.96));
    box-shadow: 0 8px 26px rgba(0,0,0,.45);
  }
  @keyframes breathe { 0%,100% { opacity: .55; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }

  /* ---- 內容區進場 ---- */
  #content { display: none; animation: fadein .6s ease both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* 內容區頂部小標題 */
  .topbar { text-align: center; padding: 26px 24px 2px; }
  .topbar .eyebrow { letter-spacing: 5px; font-size: 12px; color: var(--gold); font-weight: 700; }
  .topbar h1 { font-family: "Noto Serif TC", serif; font-size: 30px; letter-spacing: 1px; margin-top: 6px; }
  .topbar h1 .accent { color: var(--gold); }

  /* ---- 介紹小段 ---- */
  .intro { text-align: center; padding: 18px 28px 4px; }
  .intro .divider {
    width: 54px; height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 16px; border-radius: 2px;
  }
  .intro p { color: var(--ink-soft); font-size: 15px; }

  /* ---- 今日精選 ---- */
  .today-wrap { padding: 22px 18px 4px; }
  .today-card {
    background: linear-gradient(135deg, #fffdf7, #f8eed7);
    border: 1px solid var(--gold-soft);
    border-radius: 22px; padding: 22px 22px 24px;
    box-shadow: 0 16px 36px -22px rgba(150,110,30,.5);
    display: flex; gap: 18px; align-items: center; cursor: pointer;
  }
  .today-card .tag {
    display: inline-block; background: var(--gold); color: #fff;
    font-size: 12px; font-weight: 700; letter-spacing: 2px;
    padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  .today-swatch { width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0; }
  .today-info { flex: 1; min-width: 0; }
  .today-info .date { font-size: 14px; color: var(--ink-soft); }
  .today-info h2 { font-family: "Noto Serif TC", serif; font-size: 24px; margin: 2px 0 6px; }
  .today-info .reason {
    font-size: 14px; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---- 本命幸運色 鉤子卡（拿生日）---- */
  .destiny-wrap { padding: 22px 18px 4px; }
  .destiny-gate {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #2b2b3a, #4a3b5c 55%, #6a4b3a);
    border-radius: 22px; padding: 26px 24px;
    box-shadow: 0 18px 40px -22px rgba(60,40,90,.7);
    text-align: center; color: #fff;
  }
  .destiny-gate::after {
    content: ""; position: absolute; top: -40%; right: -20%;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,221,150,.35), transparent 70%);
  }
  .destiny-gate .dg-eyebrow { letter-spacing: 4px; font-size: 12px; color: #f3d9a6; font-weight: 700; }
  .destiny-gate h3 { font-family: "Noto Serif TC", serif; font-size: 23px; margin: 8px 0 6px; }
  .destiny-gate p { font-size: 14px; color: rgba(255,255,255,.82); margin-bottom: 18px; }
  .destiny-gate .dg-btn {
    display: inline-block; border: none; cursor: pointer;
    background: linear-gradient(135deg, #f3d9a6, #d4af7a);
    color: #4a2f12; font-weight: 700; font-size: 16px; letter-spacing: 1px;
    padding: 13px 30px; border-radius: 999px;
    box-shadow: 0 10px 22px -8px rgba(0,0,0,.5); transition: transform .15s;
  }
  .destiny-gate .dg-btn:active { transform: scale(.95); }
  .destiny-gate .dg-foot { margin-top: 12px; font-size: 12px; color: rgba(255,255,255,.6); }

  /* 已解鎖後的本命色小卡 */
  .destiny-result {
    background: linear-gradient(135deg, #fffdf7, #f4ead2);
    border: 1px solid var(--gold-soft); border-radius: 22px;
    padding: 20px 22px; box-shadow: 0 16px 36px -22px rgba(150,110,30,.5);
    display: flex; gap: 16px; align-items: center;
  }
  .destiny-result .dr-swatch { width: 70px; height: 70px; border-radius: 50%; flex-shrink: 0; }
  .destiny-result .dr-eyebrow { font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: 2px; }
  .destiny-result h4 { font-family: "Noto Serif TC", serif; font-size: 21px; margin: 2px 0; }
  .destiny-result .dr-sub { font-size: 13px; color: var(--ink-soft); }

  /* ---- 月曆網格 ---- */
  .section-title { text-align: center; margin: 34px 0 6px; font-family: "Noto Serif TC", serif; font-size: 21px; letter-spacing: 2px; }
  .section-hint { text-align: center; color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; }
  .grid { padding: 0 14px 60px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .day {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 15px 8px 16px; cursor: pointer; text-align: center; position: relative;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
  }
  .day:active { transform: scale(.96); }
  .day.is-today { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
  .day .star { position: absolute; top: 8px; right: 9px; font-size: 11px; color: var(--gold); font-weight: 700; }
  .day .dnum { font-family: "Noto Serif TC", serif; font-size: 23px; font-weight: 700; line-height: 1; }
  .day .wk { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .day .swatch { width: 48px; height: 48px; border-radius: 50%; margin: 12px auto 8px; }
  .day .cname { font-size: 14px; font-weight: 700; }

  /* 鎖住的未來日子 */
  .day.locked { cursor: pointer; }
  .day.locked .dnum, .day.locked .wk, .day.locked .swatch, .day.locked .cname { opacity: .28; filter: grayscale(.6); }
  .day.locked .lock {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    color: var(--ink-soft); font-size: 12px; font-weight: 500;
  }
  .day.locked .lock .ico { font-size: 22px; opacity: .55; }

  /* ---- 彈窗（共用：穿搭詳情 / 生日表單 / 本命揭曉）---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(40,34,26,.6);
    backdrop-filter: blur(3px); display: none;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 26px 26px 0 0;
    width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
    padding: 0 0 calc(28px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 50px -10px rgba(0,0,0,.5);
    animation: slideup .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-head { padding: 26px 26px 22px; text-align: center; border-bottom: 1px solid var(--line); position: relative; }
  .modal-head .grab { width: 40px; height: 4px; background: var(--line); border-radius: 999px; margin: -10px auto 14px; }
  .modal-head .close {
    position: absolute; top: 16px; right: 18px; width: 34px; height: 34px;
    border: none; background: #f2ebdc; color: var(--ink-soft);
    border-radius: 50%; font-size: 18px; cursor: pointer;
  }
  .modal-head .m-date { font-size: 14px; color: var(--ink-soft); letter-spacing: 1px; }
  .modal-head .m-swatch { width: 84px; height: 84px; border-radius: 50%; margin: 14px auto; }
  .modal-head h3 { font-family: "Noto Serif TC", serif; font-size: 25px; }
  .modal-head .match { margin-top: 8px; font-size: 14px; color: var(--ink-soft); }
  .modal-body { padding: 22px 26px 0; }
  .field { margin-bottom: 18px; }
  .field .label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 1px; margin-bottom: 4px;
  }
  .field .val { font-size: 15px; }
  .field.reason .val {
    background: #fbf5e8; border-left: 3px solid var(--gold);
    padding: 12px 14px; border-radius: 0 10px 10px 0; color: var(--ink-soft);
  }

  /* ---- 生日表單 ---- */
  .form-intro { text-align: center; padding: 4px 26px 18px; color: var(--ink-soft); font-size: 14px; }
  .form-body { padding: 0 26px; }
  .bday-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .bday-row select {
    flex: 1; padding: 13px 10px; font-size: 15px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 12px; background: #fcf8ef; color: var(--ink);
    appearance: none; text-align: center;
  }
  .email-row { margin-bottom: 22px; }
  .email-row input {
    width: 100%; padding: 13px 14px; font-size: 15px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 12px; background: #fcf8ef; color: var(--ink);
  }
  .email-row input::placeholder { color: #b3a892; }
  .gender-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .gender-row .g {
    flex: 1; text-align: center; padding: 12px 0; font-size: 15px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 12px; background: #fcf8ef; color: var(--ink-soft);
    transition: all .15s;
  }
  .gender-row .g.sel { border-color: var(--gold); background: #fbf2dd; color: var(--ink); font-weight: 700; }
  .submit-btn {
    width: 100%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #d4af7a, #b88a3e);
    color: #fff; font-weight: 700; font-size: 17px; letter-spacing: 1px;
    padding: 15px; border-radius: 14px; box-shadow: 0 12px 26px -10px rgba(150,110,30,.6);
    transition: transform .15s, opacity .15s;
  }
  .submit-btn:active { transform: scale(.98); }
  .submit-btn:disabled { opacity: .45; cursor: default; }
  .form-note { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 12px; }

  /* ---- 本命揭曉 ---- */
  .reveal { text-align: center; padding: 8px 26px 4px; }
  .reveal .big-swatch {
    width: 120px; height: 120px; border-radius: 50%; margin: 8px auto 16px;
    animation: pop .5s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .reveal .r-eyebrow { letter-spacing: 4px; font-size: 12px; color: var(--gold); font-weight: 700; }
  .reveal h3 { font-family: "Noto Serif TC", serif; font-size: 28px; margin: 6px 0 4px; }
  .reveal .r-element { font-size: 14px; color: var(--ink-soft); margin-bottom: 16px; }
  .reveal .r-desc {
    text-align: left; background: #fbf5e8; border-left: 3px solid var(--gold);
    padding: 14px 16px; border-radius: 0 12px 12px 0; color: var(--ink-soft); font-size: 14px; margin-bottom: 16px;
  }
  .reveal .r-noble {
    display: flex; align-items: center; gap: 12px; text-align: left;
    background: #f4f1ff; border-radius: 14px; padding: 14px 16px; margin-bottom: 20px;
  }
  .reveal .r-noble .nb-swatch { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
  .reveal .r-noble .nb-text { font-size: 13px; color: var(--ink-soft); }
  .reveal .r-noble .nb-text b { color: var(--ink); }

  /* ---- 背景音樂按鈕（浮動）---- */
  .music-btn {
    position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid var(--gold-soft); background: rgba(255,255,255,.9);
    backdrop-filter: blur(4px); cursor: pointer; z-index: 40;
    box-shadow: 0 8px 22px -8px rgba(120,90,30,.5);
    font-size: 22px; display: flex; align-items: center; justify-content: center; transition: transform .15s;
  }
  .music-btn:active { transform: scale(.9); }
  .music-btn.playing .note { animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; padding: 8px 20px 90px; color: var(--ink-soft); font-size: 13px; }
  footer .brand { color: var(--gold); font-weight: 700; }
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<!-- 封面進入畫面 -->
<div class="cover-screen" id="coverScreen">
  <img src="cover.png" alt="幸運體質 · 原來好運真的藏在顏色裡">
  <div class="enter-hint"><span class="pill">👆 點一下進入</span></div>
</div>

<div class="wrap" id="content">

  <div class="topbar">
    <div class="eyebrow" id="eyebrowLabel">JUNE · 幸運體質</div>
    <h1 class="serif"><span id="monthLabel">六月</span><span class="accent">幸運</span>穿搭</h1>
  </div>

  <div class="intro">
    <div class="divider"></div>
    <p>每天穿對顏色，把好運穿在身上 ✨<br>點下方任一天，看完整幸運穿搭</p>
  </div>

  <!-- 今日精選 -->
  <div class="today-wrap">
    <div class="today-card" id="todayCard">
      <div class="today-swatch" id="todaySwatch"></div>
      <div class="today-info">
        <span class="tag" id="todayTag">今日推薦</span>
        <div class="date" id="todayDate"></div>
        <h2 id="todayColor"></h2>
        <div class="reason" id="todayReason"></div>
      </div>
    </div>
  </div>

  <!-- 本命幸運色（拿生日的鉤子 / 解鎖後變成本命色小卡）-->
  <div class="destiny-wrap" id="destinyWrap"></div>

  <div class="section-title serif">— 本月幸運穿搭 —</div>
  <div class="section-hint" id="sectionHint"></div>
  <div class="grid" id="grid"></div>

  <footer>
    色彩幸運曆 · by <span class="brand">美你的事</span><br>顏色帶來氣場，行動帶來收入 💛
  </footer>
</div>

<!-- 背景音樂按鈕 -->
<button class="music-btn" id="musicBtn" aria-label="背景音樂"><span class="note">🎵</span></button>

<!-- 共用彈窗 -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ===== 頁面模式開關 =====
   "teaser" = 3 天公開版（發社群用，會引導加 LINE）
   "member" = 7 天會員版（加入後 LINE 連這頁，永遠不跳加入）
   兩個檔案只差這一行。 */
const PAGE = "teaser";

/* ====== 資料：本月 30 天幸運穿搭 ====== */
const DATA = [
  {d:1, wk:"週一", color:"奶油白", hex:"#FBF4E4", match:"淺金、米杏色", outfit:"白色襯衫、米色寬褲、奶油色洋裝", item:"金色細項鍊、米色托特包、珍珠耳環", reason:"月初適合把氣場整理乾淨。白色代表清爽、重啟、歸零，斷捨離一下，把舊的氣清掉，好運才有位置進來。搭金色小物提升整體的明亮運。"},
  {d:2, wk:"週二", color:"橘棕色", hex:"#B5651D", match:"奶茶色、咖啡色", outfit:"橘棕上衣、咖啡色長裙、奶茶色罩衫", item:"棕色皮帶、咖啡色包包、木質手環", reason:"橘棕色有行動力也有親和力。今天適合主動聯絡朋友、踏出舒適圈，有溫度的推進，讓人緣與好機會自然靠近你。"},
  {d:3, wk:"週三", color:"深藍色", hex:"#1F3A5F", match:"白色、銀色", outfit:"深藍襯衫、西裝褲、藍白條紋上衣", item:"銀色手錶、深藍髮夾、白色包款", reason:"深藍色代表專業、冷靜、判斷力。今天適合做決定、處理需要理性的事，乾淨的藍讓你少出錯，也讓貴人更信任你。"},
  {d:4, wk:"週四", color:"豆沙粉", hex:"#C98B8B", match:"玫瑰金、米白色", outfit:"豆沙粉上衣、米白裙、粉色針織外套", item:"玫瑰金耳環、粉色髮圈、小巧手拿包", reason:"好運常常是人緣帶來的。豆沙粉成熟不幼稚，今天用溫柔感增加好感度，桃花與貴人運都旺，很適合與人相處互動。"},
  {d:5, wk:"週五", color:"墨綠色", hex:"#2E4A3C", match:"金色、米色", outfit:"墨綠洋裝、綠色襯衫、米色寬褲", item:"金色戒指、綠色絲巾、米色包", reason:"墨綠色有「穩定累積」的感覺。今天適合規劃、把長遠的事打好底，不急不躁，讓好運慢慢長出來、根基更穩。"},
  {d:6, wk:"週六", color:"蜜桃橘", hex:"#FF9E80", match:"白色、淺咖色", outfit:"蜜桃橘上衣、白色牛仔褲、淺咖色短外套", item:"橘色手機殼、白色小包、咖色涼鞋", reason:"蜜桃橘有活潑的社交能量。週末很適合聚會、拍照、認識新朋友，人氣一旺，好事就容易發生。"},
  {d:7, wk:"週日", color:"燕麥色", hex:"#D9C9A8", match:"奶茶色、淺金色", outfit:"燕麥色套裝、奶茶色洋裝、針織背心", item:"金色細手鍊、奶茶色包包、裸色鞋", reason:"今天適合讓自己慢下來。燕麥色柔和、好相處，把狀態養好、把氣補回來，好運才接得住。"},
  {d:8, wk:"週一", color:"正紅色", hex:"#D32F2F", match:"黑色、金色", outfit:"紅色上衣、黑色長褲、紅色洋裝", item:"金色耳環、紅色口紅、黑金包款", reason:"正紅色提升存在感、開運氣。今天適合需要被看見、想全力以赴的場合，紅色只點綴一處最旺，氣場全開。"},

/* ====== 本命幸運色引擎（生肖 → 五行 → 幸運色）======
   白話：用出生年算生肖，生肖對應五行，五行給一個本命幸運主色，
   再用「生我者為貴人」給一個貴人色。先放在前端，之後會搬到後台的 lib 共用。 */
const ZODIAC = ["鼠","牛","虎","兔","龍","蛇","馬","羊","猴","雞","狗","豬"];
const ZODIAC_ELEMENT = {鼠:"水",牛:"土",虎:"木",兔:"木",龍:"土",蛇:"火",馬:"火",羊:"土",猴:"金",雞:"金",狗:"土",豬:"水"};
const ELEMENT_FORTUNE = {
  木: { color:"森林綠", hex:"#2F5233", noble:"海軍藍", nobleHex:"#1C2E4A",
        desc:"你的本命屬木，好運來自「開創與成長」。穿對綠色系，做新計畫、嘗試新事物、往前衝時會更有底氣，運勢也跟著往上長。" },
  火: { color:"正紅色", hex:"#D32F2F", noble:"森林綠", nobleHex:"#2F5233",
        desc:"你的本命屬火，好運來自「熱情與曝光」。紅色系幫你在人群中、重要場合更亮眼，讓人記得你、好機會主動找上門。" },
  土: { color:"焦糖色", hex:"#B8742A", noble:"正紅色", nobleHex:"#D32F2F",
        desc:"你的本命屬土，好運來自「信任與累積」。大地色系讓你穩重可靠，特別旺人際與長久關係，貴人緣慢慢累積。" },
  金: { color:"香檳金", hex:"#D4AF7A", noble:"焦糖色", nobleHex:"#B8742A",
        desc:"你的本命屬金，好運來自「質感與貴人」。金色系提升你的貴氣與魅力，重要場合、想結交的人，貴人運最旺。" },
  水: { color:"海軍藍", hex:"#1C2E4A", noble:"香檳金", nobleHex:"#D4AF7A",
        desc:"你的本命屬水，好運來自「靈活與溝通」。藍色系讓你思路清晰、表達順暢，人際與機緣都跟著順起來。" },
};
function destinyByBirthday(year){
  const z = ZODIAC[((year - 4) % 12 + 12) % 12];
  const el = ZODIAC_ELEMENT[z];
  const f = ELEMENT_FORTUNE[el];
  return { zodiac: z, element: el, ...f };
}

/* 淺色圓點補細邊框，避免在白底上看不見 */
function swatchStyle(hex){
  const light = ["#FFFFFF","#FBF4E4","#E8EBED","#F5E050","#D9C9A8","#E6D5B8","#87CEEB","#C7CCD1","#D4AF7A","#C3B091","#FF9E80","#E8A0B0"].includes(hex.toUpperCase());
  const ring = light ? "0 0 0 1px #e2d9c4 inset," : "";
  return `background:${hex};box-shadow:${ring}inset 0 0 0 3px rgba(255,255,255,.6),0 6px 14px -6px rgba(0,0,0,.28);`;
}

    const el = document.createElement("div");
    el.className = "day" + (item.d === todayN ? " is-today" : "") + (locked ? " locked" : "");

      let lockLabel, lockAction;
      if (PAGE === "teaser") { lockLabel = "加 LINE 解鎖"; lockAction = goToLine; }
      else { lockLabel = `${monthIdx + 1}/${weekStartDay(item.d)} 開放`; lockAction = () => showWeekInfo(item.d); }
      el.innerHTML = `
        <div class="dnum">${item.d}</div>
        <div class="wk">${item.wk}</div>
        <div class="swatch" style="${swatchStyle(item.hex)}"></div>
        <div class="cname">？？？</div>
        <div class="lock"><span class="ico">🔒</span><span>${lockLabel}</span></div>`;
      el.addEventListener("click", lockAction);
    } else {
      el.innerHTML = `
        ${item.d === todayN ? '<span class="star">★ 今日</span>' : ''}
        <div class="dnum">${item.d}</div>
        <div class="wk">${item.wk}</div>

}

/* ======================================================================
   設定區（每開一個新主題頁，只要改這裡 + 上面的 DATA 內容）
   ====================================================================== */
const CONFIG = {
  TOPIC: "幸運體質",          // 名單試算表會記這個主題，方便區分幸運體質/風水…
  // Google Apps Script 網址（送名單進「幸運穿搭名單」試算表）
  SHEET_WEBHOOK: "https://script.google.com/macros/s/AKfycbzbEiUEiZ72jjOqwHH9Y-mpvIxb5M8iPJjC3E22XbGJ2DpQoiz_wxiVATWjszhzWz_b/exec",
  LIFF_ID: "2010278875-7X46fusb",   // LINE LIFF（在 LINE 裡開才會生效）
};

/* LIFF 初始化：在 LINE 裡開才拿得到使用者身分，一般瀏覽器跑不起來就略過 */
(function initLiff(){
  if (!CONFIG.LIFF_ID || !window.liff) return;
  liff.init({ liffId: CONFIG.LIFF_ID })
    .then(() => { if (!liff.isLoggedIn() && liff.isInClient()) liff.login(); })
    .catch(() => {});
})();
async function getLineUserId(){
  try {
    if (window.liff && liff.getProfile) {
      const p = await liff.getProfile();
      return p.userId;
    }
  } catch(e){}
  return null;
}

/* 把一筆名單送進 Google 試算表（form-encoded）。
   用 sendBeacon：就算馬上換頁去 LINE，資料也送得出去（fetch 會被換頁中斷）。 */
async function sendLead(payload){
  if (!CONFIG.SHEET_WEBHOOK) return;
  const body = new URLSearchParams();
  Object.keys(payload).forEach(k => body.append(k, payload[k] == null ? "" : String(payload[k])));
  try {
    if (navigator.sendBeacon && navigator.sendBeacon(CONFIG.SHEET_WEBHOOK, body)) return;
    await fetch(CONFIG.SHEET_WEBHOOK, { method:"POST", body, keepalive:true });
  } catch(e){}
}

/* ====== 彈窗：生日表單 ====== */
let formState = { year:"", month:"", day:"", gender:"", email:"" };
const isEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
function openFormModal(){
  formState = { year:"", month:"", day:"", gender:"", email:"" };

  const yearOpts = years.map(y => `<option value="${y}">${y} 年</option>`).join("");
  const monthOpts = Array.from({length:12}, (_,i)=>`<option value="${i+1}">${i+1} 月</option>`).join("");
  const dayOpts = Array.from({length:31}, (_,i)=>`<option value="${i+1}">${i+1} 日</option>`).join("");
  modal.innerHTML = `

      <h3>輸入你的生日</h3>
    </div>
    <div class="form-intro">輸入生日測出你的本命幸運色，並解鎖這一週每日穿搭<br>Email 用來把每月幸運曆寄給你</div>
    <div class="form-body">
      <div class="bday-row">
        <select id="selYear"><option value="" disabled selected>出生年</option>${yearOpts}</select>
        <select id="selMonth"><option value="" disabled selected>月</option>${monthOpts}</select>
        <select id="selDay"><option value="" disabled selected>日</option>${dayOpts}</select>
      </div>
      <div class="gender-row">
        <div class="g" data-g="female">女生</div>
        <div class="g" data-g="male">男生</div>
        <div class="g" data-g="other">不透露</div>
      </div>
      <div class="email-row">
        <input id="selEmail" type="email" inputmode="email" autocomplete="email" placeholder="你的 Email（領每月幸運曆）" />
      </div>
      <button class="submit-btn" id="submitBtn" disabled>揭曉我的本命幸運色 ✨</button>
      <div class="form-note">只用來算你的幸運色、寄幸運曆給你，不會外流 🔒</div>
    </div>`;
  const check = () => {
    formState.year = document.getElementById("selYear").value;
    formState.month = document.getElementById("selMonth").value;
    formState.day = document.getElementById("selDay").value;
    formState.email = document.getElementById("selEmail").value.trim();
    document.getElementById("submitBtn").disabled =
      !(formState.year && formState.month && formState.day && formState.gender && isEmail(formState.email));
  };
  ["selYear","selMonth","selDay"].forEach(id => document.getElementById(id).addEventListener("change", check));
  document.getElementById("selEmail").addEventListener("input", check);
  modal.querySelectorAll(".gender-row .g").forEach(g => g.addEventListener("click", () => {
    modal.querySelectorAll(".gender-row .g").forEach(x => x.classList.remove("sel"));
    g.classList.add("sel"); formState.gender = g.dataset.g; check();
  }));
  document.getElementById("submitBtn").addEventListener("click", submitBirthday);
  openModal();
}

async function submitBirthday(){
  profile = {
    year: parseInt(formState.year, 10),
    month: parseInt(formState.month, 10),
    day: parseInt(formState.day, 10),
    gender: formState.gender,
    email: formState.email
  };
  saveProfile(profile);
  const d = destinyByBirthday(profile.year);
  // 送一筆名單進 Google 試算表（含主題，方便幸運穿搭/風水…分開看）
  sendLead({
    topic: CONFIG.TOPIC,
    email: profile.email,
    birthday: `${profile.year}/${profile.month}/${profile.day}`,
    gender: profile.gender,
    zodiac: d.zodiac,
    element: d.element,
    destinyColor: d.color,
    lineUserId: await getLineUserId(),
    submittedAt: new Date().toISOString()
  });
  openRevealModal(d, true);
  renderDestiny();
  renderGrid();
}

/* ====== 彈窗：本命揭曉 ====== */

/* ====== 輕鬆背景音樂（瀏覽器即時合成，免外部檔案）====== */
let audioCtx = null, master = null, delay = null, padTimer = null, melodyTimer = null, playing = false;
const CHORDS = [
  [261.63, 329.63, 392.00], [220.00, 261.63, 329.63],
  [174.61, 220.00, 261.63], [196.00, 246.94, 293.66],
];
const MELODY = [523.25, 587.33, 659.25, 783.99, 880.00];
let chordIdx = 0;
function setupAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  master = audioCtx.createGain(); master.gain.value = 0.0;
  delay = audioCtx.createDelay(); delay.delayTime.value = 0.45;
  const feedback = audioCtx.createGain(); feedback.gain.value = 0.32;
  const wet = audioCtx.createGain(); wet.gain.value = 0.5;
  delay.connect(feedback).connect(delay);
  delay.connect(wet).connect(master);
  master.connect(audioCtx.destination);
  master.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 2.5);
}
function voice(freq, time, dur, level, toDelay){
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 1600;
  osc.type = "triangle"; osc.frequency.value = freq;
  osc2.type = "sine"; osc2.frequency.value = freq * 1.005;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(level, time + dur * 0.25);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  osc.connect(gain); osc2.connect(gain);
  gain.connect(lp); lp.connect(master);
  if (toDelay) lp.connect(delay);
  osc.start(time); osc2.start(time);
  osc.stop(time + dur); osc2.stop(time + dur);
}
function schedulePad(){
  const chord = CHORDS[chordIdx % CHORDS.length]; chordIdx++;
  const nowT = audioCtx.currentTime;
  chord.forEach(f => voice(f, nowT, 8.5, 0.07, false));
  padTimer = setTimeout(schedulePad, 7000);
}
function scheduleMelody(){
  if (Math.random() < 0.75){
    const f = MELODY[Math.floor(Math.random() * MELODY.length)];
    voice(f, audioCtx.currentTime, 3.4, 0.09, true);
  }
  melodyTimer = setTimeout(scheduleMelody, 2200 + Math.random() * 2400);
}
function startMusic(){
  if (playing) return;
  if (!audioCtx) setupAudio();
  if (audioCtx.state === "suspended") audioCtx.resume();
  playing = true; schedulePad(); scheduleMelody();
}
function stopMusic(){
  if (!playing) return;
  playing = false;
  clearTimeout(padTimer); clearTimeout(melodyTimer);
  if (master) master.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
}
const musicBtn = document.getElementById("musicBtn");
musicBtn.addEventListener("click", () => {
  if (!playing){
    if (master) master.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 1.2);
    startMusic();
    musicBtn.classList.add("playing");
    musicBtn.querySelector(".note").textContent = "🎵";
  } else {
    stopMusic();
    musicBtn.classList.remove("playing");
    musicBtn.querySelector(".note").textContent = "🔇";
  }
});
</script>
